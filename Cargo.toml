[workspace]
resolver = "2"
members = [
    "crates/pdf-textlayer",
    "crates/pdf-textlayer-python",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/patelvivekdev/pdf-textlayer"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
