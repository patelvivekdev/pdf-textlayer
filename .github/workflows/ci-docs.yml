name: CI - Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/ci-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/ci-docs.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run doctor
      - run: npm run validate
      - run: npm run build
