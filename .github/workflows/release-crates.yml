name: Release - Crate & CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.3.0)"
        required: true
        type: string
      dry-run:
        description: "Dry run (build but do not publish)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Validate version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pdf-textlayer") | .version')
          if [ "$VERSION" != "${{ inputs.version }}" ]; then
            echo "::error::Cargo.toml has $VERSION, expected ${{ inputs.version }}"
            exit 1
          fi
      - run: cargo publish --locked -p pdf-textlayer --dry-run

  cli:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    name: CLI ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p pdf-textlayer --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          bin=target/${{ matrix.target }}/release/pdf-textlayer
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" dist/
          tar -czf "pdf-textlayer-${{ matrix.target }}.tar.gz" -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: pdf-textlayer-${{ matrix.target }}.tar.gz

  publish:
    needs: cli
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    # Protected by a required reviewer; CARGO_REGISTRY_TOKEN is a secret of this
    # environment, so no other job can read it.
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p pdf-textlayer

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
          gh release create "v${{ inputs.version }}" --title "v${{ inputs.version }}" --generate-notes dist/*.tar.gz
