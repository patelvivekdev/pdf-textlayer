name: Release - Python

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.3.0)"
        required: true
        type: string
      dry-run:
        description: "Dry run (build but do not publish)"
        type: boolean
        default: false

# Each job asks for what it needs: only `publish` gets an OIDC token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('packages/python/pyproject.toml', 'rb'))['project']['version'])")
          if [ "$VERSION" != "${{ inputs.version }}" ]; then
            echo "::error::packages/python/pyproject.toml has $VERSION, expected ${{ inputs.version }}"
            exit 1
          fi

  wheels:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    name: Wheel ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # One abi3 wheel per platform covers Python 3.11+.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          working-directory: packages/python
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: packages/python/dist/*.whl

  sdist:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: packages/python
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: packages/python/dist/*.tar.gz

  test:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    name: Test ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.target }}
          path: wheels
      - name: Test the built wheel
        shell: bash
        run: |
          python -m pip install wheels/*.whl pymupdf pytest
          python -m pytest packages/python/tests
          pdf-textlayer examples/scan.pdf examples/parsed.json searchable.pdf

  publish:
    needs: [test, sdist]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    # Protected by a required reviewer; named in PyPI's trusted publisher.
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC); no PyPI token is stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Attach the wheels and sdist to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ inputs.version }}
        run: |
          # release-please creates the release; a manual run creates it here.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes \
            || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" dist/* --clobber
