name: Release Please

# Keeps a release PR open that bumps the shared version in every package and
# updates CHANGELOG.md from Conventional Commit messages. Merging it creates the
# vX.Y.Z tag and GitHub release, then starts the three release workflows on
# that tag. Each publish job still waits for a maintainer's approval.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # A GitHub App token instead of GITHUB_TOKEN, so CI runs on the release
      # PR (the required checks on main) and the app, not this job, owns writes.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Dispatched rather than called, so each release workflow stays the
      # top-level workflow that npm and PyPI trusted publishing expect.
      - name: Start the release workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          for workflow in release-crates.yml release-python.yml release-node.yml; do
            gh workflow run "$workflow" --ref "$TAG" -f version="$VERSION" -f dry-run=false
          done
