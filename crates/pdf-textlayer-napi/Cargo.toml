[package]
name = "pdf-textlayer-napi"
description = "Node.js bindings for pdf-textlayer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
pdf-textlayer = { path = "../pdf-textlayer" }
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
